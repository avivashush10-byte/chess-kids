# פריסת שרת הסנכרון ב-Render (חינמי).
# פרטי Upstash לא מוקלדים כאן ולא ביד: הם נלקחים בהפניה מהשירות health-app שבאותו חשבון,
# כך שהאסימון עצמו לא עובר דרך אף אחד ולא נשמר במאגר. את קוד המשפחה מזינים בלוח הבקרה של Render.
services:
  - type: web
    name: chess-kids-sync
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_CODE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        fromService:
          name: health-app
          type: web
          envVarKey: UPSTASH_REDIS_REST_URL
      - key: UPSTASH_REDIS_REST_TOKEN
        fromService:
          name: health-app
          type: web
          envVarKey: UPSTASH_REDIS_REST_TOKEN
